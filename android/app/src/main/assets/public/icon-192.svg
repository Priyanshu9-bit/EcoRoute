<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <!-- Road track -->
  <path d="M 46 148 C 65 110, 80 100, 110 88 C 135 78, 142 54, 148 42" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.35" />
  <!-- Eco Route Dash -->
  <path d="M 46 148 C 65 110, 80 100, 110 88 C 135 78, 142 54, 148 42" fill="none" stroke="#34d399" stroke-width="6" stroke-dasharray="10 8" stroke-linecap="round" />
  <!-- Leaf icon -->
  <g filter="url(#shadow)" transform="translate(68, 60)">
    <path d="M 30 0 C 12 6, 0 24, 0 45 C 0 54, 6 60, 15 60 C 36 60, 54 48, 60 30 C 60 12, 48 0, 30 0 Z" fill="#ffffff" />
    <path d="M 6 54 C 20 40, 34 26, 48 12" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    <!-- Pin dot -->
    <circle cx="15" cy="50" r="5" fill="#10b981" />
  </g>
  <!-- Navigation indicator dot -->
  <circle cx="148" cy="42" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
</svg>

